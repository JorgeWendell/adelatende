services:
  db:
    image: postgres:16-alpine
    container_name: adelatende-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adelatende}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-adelatende}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-adelatende} -d ${POSTGRES_DB:-adelatende}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - adelatende-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: adelatende-migrate
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adelatende}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-adelatende}
      POSTGRES_HOST: db
      DATABASE_URL: postgresql://${POSTGRES_USER:-adelatende}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-adelatende}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - adelatende-network
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: adelatende-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - adelatende-network

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: adelatende-evolution
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-https://wpp.adelweb.com.br}
      SERVER_TYPE: http
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Defina EVOLUTION_API_KEY no .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-adelatende}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-adelatende}?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: adelatende
      DATABASE_SAVE_DATA_INSTANCE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: adelatende
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
      NODE_OPTIONS: --dns-result-order=ipv4first
      CONFIG_SESSION_PHONE_CLIENT: AdelAtende
      CONFIG_SESSION_PHONE_NAME: Chrome
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    volumes:
      - evolution_store:/evolution/instances
    expose:
      - "8080"
    networks:
      - adelatende-network
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.adelatende-wpp.rule=Host(`${WPP_DOMAIN:-wpp.adelweb.com.br}`)
      - traefik.http.routers.adelatende-wpp.entrypoints=websecure
      - traefik.http.routers.adelatende-wpp.tls=true
      - traefik.http.routers.adelatende-wpp.tls.certresolver=letsencrypt
      - traefik.http.routers.adelatende-wpp.service=adelatende-wpp
      - traefik.http.services.adelatende-wpp.loadbalancer.server.port=8080
      - traefik.http.routers.adelatende-wpp-http.rule=Host(`${WPP_DOMAIN:-wpp.adelweb.com.br}`)
      - traefik.http.routers.adelatende-wpp-http.entrypoints=web
      - traefik.http.routers.adelatende-wpp-http.middlewares=adelatende-wpp-https-redirect
      - traefik.http.middlewares.adelatende-wpp-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.adelatende-wpp-https-redirect.redirectscheme.permanent=true

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://atende.adelweb.com.br}
    container_name: adelatende-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-adelatende}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-adelatende}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Defina BETTER_AUTH_SECRET no .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://atende.adelweb.com.br}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://atende.adelweb.com.br}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?Defina EVOLUTION_API_KEY no .env}
      EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-http://app:3000/api/webhooks/evolution}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      evolution:
        condition: service_healthy
    networks:
      - adelatende-network
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.adelatende.rule=Host(`${APP_DOMAIN:-atende.adelweb.com.br}`)
      - traefik.http.routers.adelatende.entrypoints=websecure
      - traefik.http.routers.adelatende.tls=true
      - traefik.http.routers.adelatende.tls.certresolver=letsencrypt
      - traefik.http.routers.adelatende.service=adelatende
      - traefik.http.services.adelatende.loadbalancer.server.port=3000
      - traefik.http.routers.adelatende-http.rule=Host(`${APP_DOMAIN:-atende.adelweb.com.br}`)
      - traefik.http.routers.adelatende-http.entrypoints=web
      - traefik.http.routers.adelatende-http.middlewares=adelatende-https-redirect
      - traefik.http.middlewares.adelatende-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.adelatende-https-redirect.redirectscheme.permanent=true

networks:
  adelatende-network:
    driver: bridge
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}

volumes:
  postgres_data:
  evolution_store:
